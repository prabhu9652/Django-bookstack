{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="container" style="padding: var(--space-6) 0;">
  <!-- Header Actions -->
  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--space-6); flex-wrap: wrap; gap: var(--space-4);">
    <div>
      <h1 style="font-size: var(--font-size-2xl); font-weight: 700; color: var(--text-primary);">Resume Preview</h1>
      <p style="color: var(--text-secondary); font-size: var(--font-size-sm);">{{ resume.title }} • Template: {{ resume.template.name }}</p>
    </div>
    <div style="display: flex; gap: var(--space-3);">
      <a href="{% url 'resume_builder:edit_resume' resume.id %}" class="btn btn-secondary"><i class="fas fa-edit"></i> Edit</a>
      <a href="{% url 'resume_builder:download_resume' resume.id %}" class="btn btn-primary"><i class="fas fa-file-pdf"></i> Download PDF</a>
      <button onclick="window.print()" class="btn btn-ghost"><i class="fas fa-print"></i> Print</button>
    </div>
  </div>

  <!-- Resume Preview - Single Source of Truth -->
  <div class="resume-preview-wrapper">
    <div id="resumePreviewContainer" class="resume-preview-loading">
      <div class="loading-spinner">
        <i class="fas fa-spinner fa-spin"></i>
        <span>Loading preview...</span>
      </div>
    </div>
  </div>

  <div style="text-align: center; margin-top: var(--space-6);">
    <a href="{% url 'resume_builder:edit_resume' resume.id %}" class="btn btn-ghost"><i class="fas fa-arrow-left"></i> Back to Editor</a>
  </div>
</div>

<style>
/* Resume Preview Wrapper */
.resume-preview-wrapper {
  display: flex;
  justify-content: center;
  padding: var(--space-4);
  background: var(--bg-elevated);
  border-radius: var(--radius-xl);
  min-height: 297mm;
}

.resume-preview-loading {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 210mm;
  min-height: 297mm;
  background: #fff;
  box-shadow: 0 4px 20px rgba(0,0,0,0.2);
}

.loading-spinner {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--space-3);
  color: var(--text-secondary);
}

.loading-spinner i {
  font-size: 2rem;
  color: var(--primary);
}

/* The preview iframe/container will hold the exact PDF HTML */
#resumePreviewContainer iframe {
  width: 210mm;
  min-height: 297mm;
  border: none;
  box-shadow: 0 4px 20px rgba(0,0,0,0.2);
}

/* Print Styles */
@media print {
  body { background: white !important; }
  .container > div:first-child, .container > div:last-child { display: none !important; }
  .resume-preview-wrapper { padding: 0; background: white; }
  #resumePreviewContainer iframe { box-shadow: none; width: 100%; }
}

/* Responsive */
@media (max-width: 900px) {
  .resume-preview-wrapper { padding: var(--space-2); }
  #resumePreviewContainer iframe { width: 100%; min-height: auto; }
}
</style>

<script>
document.addEventListener('DOMContentLoaded', function() {
  // Fetch the preview HTML from the API (same HTML used for PDF generation)
  fetch('{% url "resume_builder:api_get_resume_preview_html" resume.id %}')
    .then(response => response.json())
    .then(data => {
      if (data.success) {
        // Create an iframe to display the preview
        // This ensures complete isolation and exact rendering
        const container = document.getElementById('resumePreviewContainer');
        const iframe = document.createElement('iframe');
        iframe.style.width = '210mm';
        iframe.style.minHeight = '297mm';
        iframe.style.border = 'none';
        iframe.style.boxShadow = '0 4px 20px rgba(0,0,0,0.2)';
        
        container.innerHTML = '';
        container.appendChild(iframe);
        
        // Write the HTML content to the iframe
        const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
        iframeDoc.open();
        iframeDoc.write(data.html);
        iframeDoc.close();
        
        // Adjust iframe height to content
        iframe.onload = function() {
          try {
            const body = iframeDoc.body;
            const html = iframeDoc.documentElement;
            const height = Math.max(
              body.scrollHeight, body.offsetHeight,
              html.clientHeight, html.scrollHeight, html.offsetHeight
            );
            iframe.style.height = height + 'px';
          } catch(e) {
            // If cross-origin issues, use default A4 height
            iframe.style.height = '297mm';
          }
        };
      } else {
        document.getElementById('resumePreviewContainer').innerHTML = 
          '<div class="error-message"><i class="fas fa-exclamation-triangle"></i> Failed to load preview</div>';
      }
    })
    .catch(error => {
      console.error('Preview error:', error);
      document.getElementById('resumePreviewContainer').innerHTML = 
        '<div class="error-message"><i class="fas fa-exclamation-triangle"></i> Failed to load preview</div>';
    });
});
</script>
{% endblock %}
