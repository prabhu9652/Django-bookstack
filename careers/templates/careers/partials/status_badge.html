<!-- Status Badge Partial -->
{% if status == 'applied' %}
<span class="status-badge status-applied">
    <i class="fas fa-paper-plane"></i> Applied
</span>
{% elif status == 'under_review' %}
<span class="status-badge status-under-review">
    <i class="fas fa-eye"></i> Under Review
</span>
{% elif status == 'interview' %}
<span class="status-badge status-interview">
    <i class="fas fa-comments"></i> Interview
</span>
{% elif status == 'rejected' %}
<span class="status-badge status-rejected">
    <i class="fas fa-times-circle"></i> Rejected
</span>
{% elif status == 'hired' %}
<span class="status-badge status-hired">
    <i class="fas fa-check-circle"></i> Hired
</span>
{% else %}
<span class="status-badge status-unknown">
    <i class="fas fa-question-circle"></i> {{ status|title }}
</span>
{% endif %}

<style>
.status-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 12px;
    border-radius: var(--radius-full);
    font-size: 0.8125rem;
    font-weight: 500;
}

.status-applied {
    background: rgba(59, 130, 246, 0.15);
    color: #3b82f6;
}

.status-under-review {
    background: rgba(245, 158, 11, 0.15);
    color: #f59e0b;
}

.status-interview {
    background: rgba(139, 92, 246, 0.15);
    color: #8b5cf6;
}

.status-rejected {
    background: rgba(239, 68, 68, 0.15);
    color: #ef4444;
}

.status-hired {
    background: rgba(34, 197, 94, 0.15);
    color: #22c55e;
}

.status-unknown {
    background: rgba(107, 114, 128, 0.15);
    color: #6b7280;
}
</style>
