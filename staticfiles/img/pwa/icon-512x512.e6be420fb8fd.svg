<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f1419"/>
      <stop offset="100%" style="stop-color:#1a1f26"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4a9eff"/>
      <stop offset="100%" style="stop-color:#6366f1"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Book spine -->
  <rect x="96" y="80" width="24" height="352" rx="12" fill="url(#accent)"/>
  <!-- Book body -->
  <rect x="120" y="112" width="296" height="320" rx="16" fill="url(#accent)" opacity="0.1"/>
  <!-- Content lines -->
  <line x1="160" y1="176" x2="352" y2="176" stroke="url(#accent)" stroke-width="14" stroke-linecap="round"/>
  <line x1="160" y1="240" x2="304" y2="240" stroke="url(#accent)" stroke-width="14" stroke-linecap="round"/>
  <line x1="160" y1="304" x2="256" y2="304" stroke="url(#accent)" stroke-width="14" stroke-linecap="round"/>
  <!-- Circuit nodes -->
  <circle cx="352" cy="176" r="18" fill="url(#accent)"/>
  <circle cx="304" cy="240" r="14" fill="url(#accent)"/>
  <circle cx="256" cy="304" r="10" fill="url(#accent)"/>
  <!-- Connections -->
  <path d="M352 194 L352 240 L318 240" stroke="url(#accent)" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M304 254 L304 304 L266 304" stroke="url(#accent)" stroke-width="4" fill="none" stroke-linecap="round"/>
</svg>
