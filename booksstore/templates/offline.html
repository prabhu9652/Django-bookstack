{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline - TechBookHub</title>
  <meta name="theme-color" content="#4a9eff">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    :root {
      --bg-primary: #0f1419;
      --bg-surface: #1a1f26;
      --text-primary: #e7e9ea;
      --text-secondary: #71767b;
      --accent: #4a9eff;
      --border: #2f3640;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    
    /* Navbar */
    .navbar {
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      height: 64px;
      display: flex;
      align-items: center;
    }
    
    .navbar-brand {
      font-size: 18px;
      font-weight: 700;
      color: var(--text-primary);
      text-decoration: none;
    }
    
    /* Main Content */
    .offline-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }
    
    .offline-content {
      text-align: center;
      max-width: 440px;
    }
    
    .offline-icon {
      width: 120px;
      height: 120px;
      margin: 0 auto 32px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    
    .offline-icon::before {
      content: '';
      position: absolute;
      inset: -4px;
      border: 2px dashed var(--border);
      border-radius: 50%;
      animation: rotate 20s linear infinite;
    }
    
    @keyframes rotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    
    .offline-icon svg {
      width: 48px;
      height: 48px;
      color: var(--text-secondary);
    }
    
    .offline-title {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 12px;
      color: var(--text-primary);
    }
    
    .offline-description {
      font-size: 16px;
      line-height: 1.6;
      color: var(--text-secondary);
      margin-bottom: 32px;
    }
    
    .offline-actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: center;
    }
    
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.2s ease;
      border: none;
    }
    
    .btn-primary {
      background: var(--accent);
      color: white;
    }
    
    .btn-primary:hover {
      background: #3d8be6;
      transform: translateY(-1px);
    }
    
    .btn-ghost {
      background: transparent;
      color: var(--text-secondary);
      border: 1px solid var(--border);
    }
    
    .btn-ghost:hover {
      background: var(--bg-surface);
      color: var(--text-primary);
    }
    
    /* Cached Pages Section */
    .cached-pages {
      margin-top: 48px;
      padding-top: 32px;
      border-top: 1px solid var(--border);
    }
    
    .cached-pages h3 {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 16px;
    }
    
    .cached-links {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
    }
    
    .cached-link {
      padding: 8px 16px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-primary);
      text-decoration: none;
      font-size: 14px;
      transition: all 0.2s;
    }
    
    .cached-link:hover {
      border-color: var(--accent);
      color: var(--accent);
    }
    
    /* Footer */
    .offline-footer {
      padding: 20px;
      text-align: center;
      border-top: 1px solid var(--border);
    }
    
    .offline-footer p {
      font-size: 13px;
      color: var(--text-secondary);
    }
    
    /* Status indicator */
    .status-indicator {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      background: rgba(245, 158, 11, 0.1);
      border: 1px solid rgba(245, 158, 11, 0.3);
      border-radius: 20px;
      font-size: 13px;
      color: #f59e0b;
      margin-bottom: 24px;
    }
    
    .status-dot {
      width: 8px;
      height: 8px;
      background: #f59e0b;
      border-radius: 50%;
      animation: pulse 2s ease-in-out infinite;
    }
    
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.9); }
    }
    
    /* Responsive */
    @media (max-width: 480px) {
      .offline-title {
        font-size: 24px;
      }
      
      .offline-description {
        font-size: 15px;
      }
      
      .offline-icon {
        width: 100px;
        height: 100px;
      }
      
      .offline-icon svg {
        width: 40px;
        height: 40px;
      }
    }
  </style>
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar">
    <a href="/" class="navbar-brand">TechBookHub</a>
  </nav>
  
  <!-- Main Content -->
  <main class="offline-container">
    <div class="offline-content">
      <div class="status-indicator">
        <span class="status-dot"></span>
        <span>No internet connection</span>
      </div>
      
      <div class="offline-icon">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M8.288 15.038a5.25 5.25 0 017.424 0M5.106 11.856c3.807-3.808 9.98-3.808 13.788 0M1.924 8.674c5.565-5.565 14.587-5.565 20.152 0M12.53 18.22l-.53.53-.53-.53a.75.75 0 011.06 0z" />
          <path stroke-linecap="round" stroke-linejoin="round" d="M3 3l18 18" stroke-width="2" />
        </svg>
      </div>
      
      <h1 class="offline-title">You're Offline</h1>
      
      <p class="offline-description">
        It looks like you've lost your internet connection. Don't worry — some pages you've visited before may still be available.
      </p>
      
      <div class="offline-actions">
        <button class="btn btn-primary" onclick="location.reload()">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
          </svg>
          Try Again
        </button>
        
        <a href="/" class="btn btn-ghost">
          Go to Home
        </a>
      </div>
      
      <div class="cached-pages" id="cachedPages" style="display: none;">
        <h3>Available Offline</h3>
        <div class="cached-links" id="cachedLinks">
          <!-- Populated by JavaScript -->
        </div>
      </div>
    </div>
  </main>
  
  <!-- Footer -->
  <footer class="offline-footer">
    <p>TechBookHub works best with an internet connection</p>
  </footer>
  
  <script>
    // Check for cached pages and display them
    async function showCachedPages() {
      if (!('caches' in window)) return;
      
      try {
        const cache = await caches.open('techbookhub-pages-v1.0.0');
        const keys = await cache.keys();
        
        const pages = keys
          .map(req => new URL(req.url))
          .filter(url => url.pathname !== '/offline/' && url.pathname !== '/')
          .map(url => ({
            path: url.pathname,
            name: getPageName(url.pathname)
          }))
          .slice(0, 6); // Limit to 6 pages
        
        if (pages.length > 0) {
          const container = document.getElementById('cachedPages');
          const links = document.getElementById('cachedLinks');
          
          pages.forEach(page => {
            const link = document.createElement('a');
            link.href = page.path;
            link.className = 'cached-link';
            link.textContent = page.name;
            links.appendChild(link);
          });
          
          container.style.display = 'block';
        }
      } catch (e) {
        console.log('Could not check cached pages');
      }
    }
    
    function getPageName(pathname) {
      const names = {
        '/books/': 'Books',
        '/careers/': 'Careers',
        '/roadmap/': 'Roadmaps',
        '/resume-builder/': 'Resume Builder',
        '/about/': 'About',
      };
      
      for (const [path, name] of Object.entries(names)) {
        if (pathname.startsWith(path)) return name;
      }
      
      return pathname.split('/').filter(Boolean).pop() || 'Page';
    }
    
    // Auto-reload when back online
    window.addEventListener('online', () => {
      location.reload();
    });
    
    showCachedPages();
  </script>
</body>
</html>
