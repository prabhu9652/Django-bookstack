<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1f26"/>
      <stop offset="100%" style="stop-color:#0f1419"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4a9eff"/>
      <stop offset="100%" style="stop-color:#6366f1"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  
  <!-- Book Icon -->
  <g transform="translate(128, 128)">
    <!-- Book spine -->
    <rect x="0" y="20" width="40" height="216" rx="4" fill="url(#accent)"/>
    
    <!-- Book pages -->
    <path d="M48 16 L248 16 C252 16 256 20 256 24 L256 232 C256 236 252 240 248 240 L48 240 L48 16 Z" fill="#e7e9ea"/>
    
    <!-- Page lines -->
    <rect x="72" y="56" width="160" height="8" rx="4" fill="#71767b" opacity="0.4"/>
    <rect x="72" y="80" width="140" height="8" rx="4" fill="#71767b" opacity="0.4"/>
    <rect x="72" y="104" width="160" height="8" rx="4" fill="#71767b" opacity="0.4"/>
    <rect x="72" y="128" width="120" height="8" rx="4" fill="#71767b" opacity="0.4"/>
    <rect x="72" y="152" width="160" height="8" rx="4" fill="#71767b" opacity="0.4"/>
    <rect x="72" y="176" width="100" height="8" rx="4" fill="#71767b" opacity="0.4"/>
    
    <!-- Accent bar -->
    <rect x="72" y="200" width="80" height="12" rx="6" fill="url(#accent)"/>
  </g>
</svg>
