<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" fill="none">
  <!-- TechBookHub Full Logo - Icon + Text -->
  <!-- For website headers -->
  
  <defs>
    <linearGradient id="fullGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4a9eff"/>
      <stop offset="100%" style="stop-color:#6366f1"/>
    </linearGradient>
  </defs>
  
  <!-- Icon (scaled down) -->
  <g transform="translate(4, 4) scale(0.109375)">
    <!-- Rounded square background -->
    <rect x="64" y="64" width="384" height="384" rx="80" fill="url(#fullGradient)"/>
    
    <!-- Book Shape -->
    <g fill="#ffffff">
      <path d="M160 140 L160 372 L256 352 L256 120 Z" opacity="0.95"/>
      <path d="M352 140 L352 372 L256 352 L256 120 Z" opacity="0.7"/>
    </g>
    
    <!-- Circuit node -->
    <circle cx="304" cy="200" r="12" fill="#ffffff" opacity="0.9"/>
    <circle cx="304" cy="280" r="8" fill="#ffffff" opacity="0.9"/>
    <path d="M304 212 L304 272" stroke="#ffffff" stroke-width="4" opacity="0.9"/>
    
    <!-- Text lines -->
    <g fill="url(#fullGradient)" opacity="0.6">
      <rect x="180" y="180" width="50" height="8" rx="4"/>
      <rect x="180" y="210" width="40" height="8" rx="4"/>
      <rect x="180" y="260" width="45" height="8" rx="4"/>
      <rect x="180" y="290" width="35" height="8" rx="4"/>
    </g>
  </g>
  
  <!-- Text: TechBookHub -->
  <text x="72" y="42" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="24" 
        font-weight="500" 
        fill="#e7e9ea"
        letter-spacing="-0.5">
    <tspan fill="url(#fullGradient)">Tech</tspan><tspan fill="#e7e9ea">Book</tspan><tspan fill="url(#fullGradient)">Hub</tspan>
  </text>
</svg>
