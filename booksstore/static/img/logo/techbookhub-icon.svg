<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4a9eff"/>
      <stop offset="100%" style="stop-color:#6366f1"/>
    </linearGradient>
  </defs>
  <!-- Book shape - minimal, abstract -->
  <path d="M128 96 L128 416 Q128 432 144 432 L368 432 Q384 432 384 416 L384 128 Q384 112 368 112 L176 112 L176 96 Q176 80 160 80 L144 80 Q128 80 128 96 Z" 
        fill="url(#iconGradient)" opacity="0.15"/>
  <!-- Book spine -->
  <rect x="128" y="80" width="16" height="368" rx="8" fill="url(#iconGradient)"/>
  <!-- Page lines - circuit-like -->
  <line x1="176" y1="160" x2="352" y2="160" stroke="url(#iconGradient)" stroke-width="8" stroke-linecap="round"/>
  <line x1="176" y1="208" x2="320" y2="208" stroke="url(#iconGradient)" stroke-width="8" stroke-linecap="round"/>
  <line x1="176" y1="256" x2="288" y2="256" stroke="url(#iconGradient)" stroke-width="8" stroke-linecap="round"/>
  <!-- Circuit nodes -->
  <circle cx="352" cy="160" r="12" fill="url(#iconGradient)"/>
  <circle cx="320" cy="208" r="10" fill="url(#iconGradient)"/>
  <circle cx="288" cy="256" r="8" fill="url(#iconGradient)"/>
  <!-- Connection lines -->
  <path d="M352 172 L352 208 L330 208" stroke="url(#iconGradient)" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M320 218 L320 256 L296 256" stroke="url(#iconGradient)" stroke-width="4" fill="none" stroke-linecap="round"/>
</svg>
